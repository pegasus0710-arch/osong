<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>힐스테이트 오송역 퍼스트 · 입주민 공동구매</title>
<meta name="description" content="힐스테이트 오송역 퍼스트 입주민 대상 삼성스토어 공동구매 제안">
<meta property="og:title" content="힐스테이트 오송역 퍼스트 입주민 공동구매">
<meta property="og:description" content="삼성스토어와 함께하는 입주민 공동구매 특별 제안">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14181f; --navy:#0d1830; --ink2:#4a5263; --mute:#8b909b; --line:#e7e2d8; --line2:#f0ece4;
  --bg:#f5f3ee; --card:#fff; --blue:#0d1830; --blue2:#a7823f; --sky:#f6f0e4;
  --accent:#c9a467; --gold:#a7823f; --red:#b7372b; --radius:18px; --serif:"Noto Serif KR",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;word-break:keep-all}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* HERO */
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(150deg,#0a1530 0%,#13286e 55%,#1d3fae 100%)}
.hero:before{content:"";position:absolute;inset:0;background:
  radial-gradient(600px 300px at 85% 10%,rgba(199,167,108,.28),transparent 70%),
  radial-gradient(500px 400px at 0% 100%,rgba(255,255,255,.08),transparent 70%)}
.hero .wrap{position:relative;padding-top:28px;padding-bottom:44px}
.brandrow{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.08em;opacity:.9}
.brandrow b{font-weight:800;letter-spacing:.14em}
.brandrow i{width:4px;height:4px;border-radius:50%;background:var(--accent)}
.hero .apt{margin-top:34px;font-size:15px;color:var(--accent);font-weight:700;letter-spacing:.02em}
.hero h1{margin-top:6px;font-size:clamp(28px,7vw,48px);font-weight:800;line-height:1.22;letter-spacing:-.02em}
.hero p.sub{margin-top:12px;font-size:clamp(14px,3.6vw,17px);opacity:.82}
.period{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:13.5px}
.benefits{margin-top:26px;display:grid;gap:10px;grid-template-columns:1fr}
.benefit{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:14.5px}
.benefit span{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#1b1408;font-weight:800;font-size:13px}

/* TABS */
.tabs{position:sticky;top:0;z-index:20;background:rgba(244,246,249,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:12px;padding-bottom:12px;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 15px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap;transition:.15s}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* SECTIONS */
main{padding:8px 0 40px}
.sec{padding-top:34px;scroll-margin-top:64px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.sec-h h2{font-size:21px;font-weight:800;letter-spacing:-.01em}
.sec-h small{color:var(--mute);font-size:13px}
.sec.feature .sec-h h2:before{content:"PREMIUM";display:inline-block;margin-right:8px;padding:3px 8px;border-radius:6px;background:var(--accent);color:#1b1408;font-size:11px;letter-spacing:.1em;vertical-align:4px}
.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}

/* CARD */
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 30px -14px rgba(13,27,46,.25)}
.thumb{position:relative;aspect-ratio:1/1;background:linear-gradient(160deg,#fafbfd,#eef1f6);display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:contain;padding:6%}
.thumb svg{width:44%;height:44%;color:#b5bfcf}
.badge{position:absolute;top:10px;left:10px;padding:4px 9px;border-radius:7px;background:var(--blue);color:#fff;font-size:11.5px;font-weight:700}
.body{display:flex;flex-direction:column;flex:1;padding:13px 13px 15px}
.model{font-size:11.5px;color:var(--mute);font-weight:600;letter-spacing:.02em;word-break:break-all}
.name{margin-top:3px;font-size:15px;font-weight:700;line-height:1.35}
.specs{margin-top:8px;list-style:none;display:grid;gap:3px}
.specs li{position:relative;padding-left:10px;font-size:12.5px;color:var(--ink2);line-height:1.4}
.specs li:before{content:"";position:absolute;left:0;top:.62em;width:4px;height:4px;border-radius:50%;background:#b9c3d4}
.prices{margin-top:auto;padding-top:12px}
.prices .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.prices .lbl{font-size:12px;color:var(--mute)}
.list-v{font-size:13px;color:var(--mute)}
.list-v.num{text-decoration:line-through}
.gb{margin-top:4px;padding-top:8px;border-top:1px dashed var(--line);flex-direction:column;align-items:flex-start!important;gap:2px!important}
.gb-v,.gb .ph{align-self:flex-end}
.gb .lbl{color:var(--blue);font-weight:700}
.gb-v{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.gb-v .pct{color:var(--red);margin-right:5px;font-size:15px}
.ph{color:var(--blue2);font-weight:700;font-size:15px;background:var(--sky);padding:1px 8px;border-radius:6px}
.list-v.ph-l{font-size:13px;color:var(--mute);text-decoration:none}
.feature .grid{grid-template-columns:1fr 1fr}
.feature .card{border-color:#e0d3b8}
.feature .thumb{background:linear-gradient(160deg,#fffdf8,#f4eee2)}
.feature .thumb svg{color:#cdb98f}

/* CONTACT / NOTICE */
.contact{margin-top:44px;border-radius:22px;background:var(--ink);color:#fff;padding:26px 20px;display:grid;gap:14px}
.contact h3{font-size:20px;font-weight:800}
.contact p{opacity:.75;font-size:14px}
.cbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;background:#fff;color:var(--ink);font-weight:800;font-size:16px;text-decoration:none}
.notice{margin-top:26px;padding:0 4px}
.notice h4{font-size:14px;margin-bottom:8px}
.notice li{font-size:12.5px;color:var(--mute);margin-left:16px;margin-bottom:4px}
footer{padding:26px 0 calc(30px + env(safe-area-inset-bottom));text-align:center;color:var(--mute);font-size:12px;user-select:none;-webkit-user-select:none}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;display:none;align-items:center;gap:6px;height:48px;padding:0 18px;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;box-shadow:0 10px 24px -8px rgba(20,40,160,.6);text-decoration:none}
.fab.show{display:flex}

@media (min-width:640px){
  .benefits{grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:repeat(3,1fr);gap:16px}
  .contact{grid-template-columns:1fr auto;align-items:center;padding:30px 32px}
  .gb{flex-direction:row;align-items:baseline!important;justify-content:space-between}
  .cbtn{padding:0 28px}
}
@media (min-width:980px){
  .hero .wrap{padding-top:36px;padding-bottom:64px}
  .grid{grid-template-columns:repeat(4,1fr);gap:18px}
  .feature .grid{grid-template-columns:repeat(4,1fr)}
  .body{padding:16px 16px 18px}
  .name{font-size:16px}
  .fab{display:none!important}
}

/* ===== ADMIN ===== */
#admin{position:fixed;inset:0;z-index:100;background:#f6f7fa;display:none;flex-direction:column}
#admin.open{display:flex}
.ad-top{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#111827;color:#fff}
.ad-top b{flex:1;font-size:15px}
.ad-top button{padding:8px 12px;border-radius:9px;background:rgba(255,255,255,.12);font-size:13px;font-weight:600}
.ad-top .pri{background:#3b82f6}
.ad-tabs{display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.ad-tabs button{flex:none;padding:7px 13px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.ad-tabs button.on{background:var(--sky);color:var(--blue)}
.ad-body{flex:1;overflow:auto;padding:16px;padding-bottom:80px}
.ad-body .inner{max-width:860px;margin:0 auto}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;padding:10px 12px;border:1px solid #d5dbe5;border-radius:10px;font:inherit;font-size:14.5px;background:#fff;color:var(--ink)}
.fld textarea{min-height:80px;resize:vertical}
.fld em{display:block;font-style:normal;font-size:11.5px;color:var(--mute);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.box h3{font-size:15px;margin-bottom:12px}
.pitem{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.pitem.hid{opacity:.55}
.phead{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer}
.phead .t{flex:1;min-width:0}
.phead .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .t small{color:var(--mute);font-size:12px}
.phead .st{font-size:11px;padding:2px 7px;border-radius:6px;background:#fef3c7;color:#92400e;flex:none}
.phead .st.ok{background:#dcfce7;color:#166534}
.mini{width:30px;height:30px;border-radius:8px;background:#f1f3f7;font-size:14px;flex:none}
.pbody{display:none;padding:4px 12px 14px;border-top:1px solid var(--line)}
.pitem.open .pbody{display:block}
.row-btn{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{padding:9px 14px;border-radius:10px;background:#eef1f6;font-size:13.5px;font-weight:600}
.btn.blue{background:var(--blue);color:#fff}
.btn.red{background:#fee2e2;color:#b91c1c}
.calc{display:flex;gap:6px;align-items:center;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:8px 10px;margin-bottom:12px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.calc input{width:70px;padding:6px 8px;border:1px solid #d5dbe5;border-radius:8px;font:inherit}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:200;background:#111827;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.lock{position:fixed;inset:0;z-index:150;background:rgba(10,15,30,.6);display:none;place-items:center;padding:20px}
.lock.open{display:grid}
.lock .pane{width:100%;max-width:340px;background:#fff;border-radius:18px;padding:22px}
.lock h3{font-size:17px;margin-bottom:12px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:12px}
.imgprev{width:72px;height:72px;border-radius:10px;border:1px solid var(--line);object-fit:contain;background:#f6f7fa}
/* option row */
.opt{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:6px;font-size:12px;color:var(--ink2)}
.opt b{font-weight:700;color:var(--ink)}
.opt .ph2{color:var(--blue2);font-weight:700}
.card{cursor:pointer}
.more{margin-top:10px;font-size:12px;color:var(--blue2);font-weight:700;display:flex;align-items:center;gap:4px}
/* detail modal */
#pd{position:fixed;inset:0;z-index:90;display:none}
#pd.open{display:block}
#pd .dim{position:absolute;inset:0;background:rgba(10,15,30,.55);animation:fd .2s}
#pd .sheet{position:absolute;left:0;right:0;bottom:0;top:6vh;background:#fff;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fd{from{opacity:0}}
.pd-top{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.pd-top b{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd-x{width:36px;height:36px;border-radius:50%;background:#f1f3f7;font-size:18px;flex:none}
.pd-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.pd-gwrap{position:relative;min-width:0}
.pd-split>div{min-width:0}
.pd-gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior-x:contain;touch-action:pan-x pan-y;cursor:grab;user-select:none;-webkit-user-select:none;background:linear-gradient(160deg,#fafbfd,#eef1f6);scrollbar-width:none}
.pd-gal::-webkit-scrollbar{display:none}
.pd-gal div{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3;display:grid;place-items:center}
.pd-gal img{width:100%;height:100%;object-fit:contain;padding:6%;pointer-events:none;-webkit-user-drag:none}
.pd-gal.drag{cursor:grabbing;scroll-snap-type:none;scroll-behavior:auto}
.pd-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 4px 14px -4px rgba(13,27,46,.35);font-size:20px;font-weight:700;color:var(--ink);display:grid;place-items:center;z-index:2}
.pd-nav.l{left:10px}.pd-nav.r{right:10px}
.pd-nav[disabled]{opacity:0;pointer-events:none}
.pd-cnt{position:absolute;right:12px;bottom:12px;background:rgba(13,27,46,.6);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;z-index:2}
.pd-dots i{cursor:pointer;transition:.2s}
.pd-dots{display:flex;justify-content:center;gap:6px;padding:10px 0 0}
.pd-dots i{width:6px;height:6px;border-radius:50%;background:#cfd6e2}
.pd-dots i.on{background:var(--ink);width:16px;border-radius:3px}
.pd-info{padding:16px 18px 6px}
.pd-info .name{font-size:19px;margin-top:4px}
.pd-info .specs li{font-size:13.5px}
.pd-info .prices{padding-top:14px}
.pd-info .gb-v{font-size:20px}
.pd-act{display:grid;grid-template-columns:1fr;gap:8px;padding:14px 18px}
.pd-act a,.pd-act button{display:flex;align-items:center;justify-content:center;height:46px;border-radius:12px;font-weight:700;font-size:14.5px;text-decoration:none}
.pd-act .p1{background:var(--ink);color:#fff}
.pd-act .p2{background:#eef1f6;color:var(--ink)}
.pd-spec{padding:6px 18px 30px}
.pd-spec h4{font-size:15px;margin:10px 0 8px}
.sg{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.sg summary{list-style:none;padding:12px 14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;cursor:pointer}
.sg summary::-webkit-details-marker{display:none}
.sg summary:after{content:"+";color:var(--mute)}
.sg[open] summary:after{content:"−"}
.sg table{width:100%;border-collapse:collapse;font-size:13px}
.sg td{padding:8px 14px;border-top:1px solid #f0f2f6;vertical-align:top}
.sg td:first-child{color:var(--mute);width:42%}
.pd-src{font-size:11.5px;color:var(--mute);padding:0 18px 24px}
@media (min-width:760px){
  #pd .sheet{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(920px,94vw);height:min(86vh,860px);border-radius:22px;animation:fd .2s}
  .pd-split{display:grid;grid-template-columns:1.05fr 1fr}
  .pd-gal div{aspect-ratio:1/1}
  .pd-info{padding:22px 24px 6px}
  .pd-act{padding:14px 24px}
}
.draftbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fef3c7;color:#78350f;font-size:13px;text-align:center;padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
.draftbar.show{display:block}
.draftbar button{text-decoration:underline;font-weight:700;margin-left:6px}

/* ===== THEME: 에어컨 시뮬레이터와 통일 (navy · gold · serif) ===== */
.hero{background:radial-gradient(700px 300px at 90% -20%,rgba(201,164,103,.28),transparent 70%),linear-gradient(160deg,#0a1326,#13244a 70%,#1a3063)}
.hero:before{display:none}
.brandrow{font-size:11px;letter-spacing:.22em;color:var(--accent);opacity:1}
.brandrow b{letter-spacing:.22em}
.hero .apt{color:var(--accent);letter-spacing:.06em;font-size:14px}
.hero h1{font-family:var(--serif);font-weight:700;letter-spacing:-.01em;line-height:1.3}
.period{background:rgba(255,255,255,.06);border-color:rgba(201,164,103,.35)}
.benefit{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1)}
.benefit span{background:linear-gradient(180deg,#d1ae72,#b08a47)}
.tabs{background:rgba(245,243,238,.94)}
.tab{border-color:var(--line)}
.tab.on{background:var(--navy);border-color:var(--navy)}
.sec-h h2{font-family:var(--serif);font-weight:700;font-size:22px}
.sec.feature .sec-h h2:before{font-family:"Pretendard Variable",Pretendard,sans-serif;background:linear-gradient(180deg,#d1ae72,#b08a47)}
.card{border-color:var(--line);box-shadow:0 12px 30px -26px rgba(13,24,48,.35)}
.card:hover{box-shadow:0 18px 36px -22px rgba(13,24,48,.35)}
.thumb{background:linear-gradient(160deg,#fdfcfa,#f1ede5)}
.badge{background:var(--navy);color:var(--accent);letter-spacing:.04em}
.specs li:before{background:var(--accent)}
.gb{border-top-color:var(--line)}
.gb .lbl{color:var(--gold)}
.gb-v{font-family:var(--serif);font-weight:700}
.ph{color:var(--gold);background:var(--sky)}
.feature .card{border-color:#e3d6bc}
.contact{background:linear-gradient(165deg,#0d1830,#172848)}
.contact h3{font-family:var(--serif);font-weight:700}
.cbtn{background:linear-gradient(180deg,#d1ae72,#b08a47);color:#1b1407}
.fab{background:var(--navy);color:var(--accent)}
.pd-info .gb-v{font-family:var(--serif)}
.pd-act .p1{background:var(--navy)}
.pd-dots i.on{background:var(--navy)}
/* admin theme */
#admin{background:var(--bg)}
.ad-top{background:linear-gradient(160deg,#0a1326,#13244a 70%,#1a3063)}
.ad-top b{font-family:var(--serif);font-weight:700;font-size:16px}
.ad-top .pri{background:linear-gradient(180deg,#d1ae72,#b08a47);color:#1b1407;font-weight:800}
.ad-tabs{background:#fff;border-bottom-color:var(--line)}
.ad-tabs button.on{background:var(--navy);color:#fff}
.box{border-color:var(--line);border-radius:16px}
.box h3{font-family:var(--serif);font-weight:700}
.pitem{border-color:var(--line);border-radius:14px}
.phead .st{background:var(--sky);color:var(--gold)}
.phead .st.ok{background:#e8eef7;color:var(--navy)}
.btn{background:#f1eee8;color:var(--ink)}
.btn.blue{background:var(--navy);color:#fff}
.btn.gold{background:linear-gradient(180deg,#d1ae72,#b08a47);color:#1b1407;font-weight:800}
.fld input,.fld textarea,.fld select{border-color:var(--line)}
.lock .pane h3{font-family:var(--serif)}
input[type=checkbox]{accent-color:var(--navy)}
.prices .lbl{white-space:nowrap}

let DATA = null, ORIGINAL = null;

async function load(){
  let d = null;
  try{
    const r = await fetch("data.json?v=" + Date.now(), {cache:"no-store"});
    if(r.ok) d = await r.json();
  }catch(e){}
  if(!d) d = FALLBACK;
  ORIGINAL = JSON.parse(JSON.stringify(d));
  const draft = LS.get("gb_draft");
  if(draft){ try{ DATA = JSON.parse(draft); $("#draftbar").classList.add("show"); }catch(e){ DATA = d; } }
  else DATA = d;
  render();
  if(location.hash === "#admin" || new URLSearchParams(location.search).has("admin")) openLock();
  const m = location.hash.match(/^#p=(.+)$/); if(m){ history.replaceState(null,"",location.pathname); openDetail(decodeURIComponent(m[1])); }
}

const AC_SIZE_HINT = s => /59/.test(s) ? "전용 59㎡ · 2~4실" : "전용 74~84㎡ · 2~5실(전실)";
function acCard(p, all){
  const a=p.ac, twin = all.find(x=>x.ac.size===a.size && x.ac.rooms===a.rooms && x.ac.line!==a.line);
  const diff = (a.line==="인피니트" && twin && isNum(p.price) && isNum(twin.price)) ? Number(p.price)-Number(twin.price) : 0;
  return `<article class="card ac-card ${a.line==="인피니트"?"inf":""}" data-id="${esc(p.id)}" tabindex="0">
    <div class="thumb">${p.img?`<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy">`:iconSvg(p.cat)}<span class="ac-rooms">${a.rooms}<small>실</small></span>${p.badge?`<span class="badge">${esc(p.badge)}</span>`:""}</div>
    <div class="body">
      <div class="model">${a.line==="인피니트"?"INFINITE LINE":"WINDFREE"} · ${esc(a.size)}</div>
      <div class="name">${a.rooms}실 SET${a.full?" <em>전실</em>":""}</div>
      <div class="ac-comp"><span class="o">실외기 ${esc(a.out)}</span>${(a.ins||[]).map(x=>`<span>${esc(x)}</span>`).join("")}</div>
      ${priceBlock(p)}
      ${diff?`<div class="ac-diff">일반형 대비 +${Number(diff).toLocaleString()}원</div>`:""}
      <div class="more">상세정보 보기 ›</div>
    </div></article>`;
}
function renderAC(list){
  const sizes=[...new Set(list.map(p=>p.ac.size))], lines=[...new Set(list.map(p=>p.ac.line))].sort((a,b)=>a==="일반"?-1:1);
  if(!sizes.includes(ACF.size)) ACF.size=sizes[0]; if(!lines.includes(ACF.line)) ACF.line=lines[0];
  const sel=list.filter(p=>p.ac.size===ACF.size && p.ac.line===ACF.line).sort((a,b)=>a.ac.rooms-b.ac.rooms);
  const rooms=[...new Set(list.filter(p=>p.ac.size===ACF.size).map(p=>p.ac.rooms))].sort((a,b)=>a-b);
  const cell=(r,l)=>{ const p=list.find(x=>x.ac.size===ACF.size&&x.ac.rooms===r&&x.ac.line===l); return p?`<td class="v ${l==="인피니트"?"inf":""} ${l===ACF.line?"on":""}" data-id="${esc(p.id)}">${isNum(p.price)?Number(p.price).toLocaleString():"미정"}${finalOf(p)!=null?`<small class="fin">최종 ${finalOf(p).toLocaleString()}</small>`:""}</td>`:`<td class="${l==="인피니트"?"inf":""}">-</td>`; };
  const comp=r=>{ const p=list.find(x=>x.ac.size===ACF.size&&x.ac.rooms===r); return p?`${esc(p.ac.out)} · ${(p.ac.ins||[]).map(x=>x.replace("평형","")).join("+")}평`:""; };
  return `<div class="acw">
    <div class="ac-pick">
      <div class="ac-q"><span>STEP 1</span><b>우리 집 평형을 선택하세요</b></div>
      <div class="ac-seg">${sizes.map(z=>`<button data-acs="${esc(z)}" class="${z===ACF.size?"on":""}"><b>${esc(z)}</b><small>${AC_SIZE_HINT(z)}</small></button>`).join("")}</div>
      <div class="ac-q"><span>STEP 2</span><b>디자인을 선택하세요</b></div>
      <div class="ac-seg ac-line">${lines.map(l=>`<button data-acl="${esc(l)}" class="${l===ACF.line?"on":""} ${l==="인피니트"?"inf":""}"><i>${(AC_LINE[l]||{}).tag||""}</i><b>무풍 ${esc(l)}</b><small>${(AC_LINE[l]||{}).d||""}</small></button>`).join("")}</div>
    </div>
    <div class="ac-sub"><b>${esc(ACF.size)}</b> 추천 SET · 무풍 ${esc(ACF.line)}</div>
    <div class="grid ac-grid">${sel.map(p=>acCard(p,list)).join("")}</div>
    <div class="ac-tw"><div class="ac-th">${esc(ACF.size)} 한눈에 비교 <small>${list.some(hasPt)?"공동구매 혜택가 / 포인트 적용 최종가 · 원":"SET 공동구매가 · 원"}</small></div>
      <div class="ac-tsc"><table class="ac-t"><thead><tr><th>구성</th><th class="cmp">실외기 · 실내기</th>${lines.map(l=>`<th class="${l==="인피니트"?"inf":""} ${l===ACF.line?"on":""}">무풍 ${esc(l)}</th>`).join("")}</tr></thead>
      <tbody>${rooms.map(r=>`<tr><td class="r">${r}실${r===5?" <em>전실</em>":""}</td><td class="cmp">${comp(r)}</td>${lines.map(l=>cell(r,l)).join("")}</tr>`).join("")}</tbody></table></div>
      ${list.some(hasPt)?`<p class="ac-pt"><b>포인트 안내</b>${esc(ptNote())}</p>`:""}</div>
  </div>`;
}
document.addEventListener("click", e=>{
  const s=e.target.closest("[data-acs]"), l=e.target.closest("[data-acl]");
  if(s){ ACF.size=s.dataset.acs; render(); return; }
  if(l){ ACF.line=l.dataset.acl; render(); return; }
  const td=e.target.closest(".ac-t td[data-id]"); if(td){ e.stopPropagation(); openDetail(td.dataset.id); }
}, true);

const PT_NOTE_DEF = "포인트는 제품 배송 3일 이후 적립되며, 캐시백 신청 시 2개월 후 캐시백으로 받으실 수 있습니다. 자세한 내용은 상담 시 매니저에게 문의해 주세요.";
const ptNote = () => (DATA.site.pointNote||PT_NOTE_DEF);
const hasPt = p => isNum(p.point) && Number(p.point)>0;
const finalOf = p => (isNum(p.price)&&hasPt(p)) ? Number(p.price)-Number(p.point) : null;
function ptRows(p){
  if(!hasPt(p)) return "";
  const f=finalOf(p);
  return `<div class="row pt"><span class="lbl">추가 포인트</span><span class="pt-v">+${Number(p.point).toLocaleString()}P</span></div>
    <div class="row fin"><span class="lbl">최종 혜택가<small>포인트 적용 시</small></span>${f!=null?`<span class="fin-v">${won(f)}</span>`:`<span class="ph">추후 안내</span>`}</div>
    <p class="pt-note">${esc(ptNote())}</p>`;
}
function priceBlock(p){
  const s = DATA.site;
  const hasL = isNum(p.list), hasP = isNum(p.price);
  const pct = (hasL && hasP && s.showDiscount && Number(p.price) < Number(p.list)) ? Math.round((1 - p.price / p.list) * 100) : 0;
  const gbL = hasPt(p) ? "공동구매 혜택가" : (p.ac?"SET 공동구매가":"공동구매가");
  if(p.hideList) return `<div class="prices"><div class="row gb"><span class="lbl">${gbL}</span>${hasP ? `<span class="gb-v">${won(p.price)}</span>` : `<span class="ph">공동구매가</span>`}</div>${ptRows(p)}</div>`;
  return `<div class="prices">
    <div class="row"><span class="lbl">희망 권장소비자가</span>${hasL ? `<span class="list-v num">${won(p.list)}</span>` : `<span class="list-v ph-l">희망 권장소비자가</span>`}</div>
    <div class="row gb"><span class="lbl">${gbL}</span>${hasP ? `<span class="gb-v">${pct?`<span class="pct">${pct}%</span>`:""}${won(p.price)}</span>` : `<span class="ph">공동구매가</span>`}</div>
    ${ptRows(p)}
  </div>`;
}
function optRow(p){
  if(!p.optLabel) return "";
  const v = isNum(p.optPrice) ? `<b>+${won(p.optPrice)}</b>` : `<span class="ph2">+ 00만원</span>`;
  return `<div class="opt"><span>${esc(p.optLabel)}</span>${v}</div>`;
}
/* 도어 열림 방향 (좌열림=우힌지 / 우열림=좌힌지) */
function doorTag(p, cls=""){
  if(!p.door) return "";
  const L = p.door==="좌열림";
  const ico = `<svg viewBox="0 0 16 22" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="${L?3.6:10.6}" y="7" width="1.8" height="8" rx=".9" fill="currentColor"/><circle cx="${L?13:3}" cy="5" r="1" fill="currentColor"/><circle cx="${L?13:3}" cy="17" r="1" fill="currentColor"/></svg>`;
  return `<span class="door ${L?"l":"r"} ${cls}">${ico}<b>${esc(p.door)}</b><small>${L?"우힌지":"좌힌지"}</small></span>`;
}
function card(p){
  const img = p.img ? `<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy" onerror="this.replaceWith(document.createRange().createContextualFragment(iconSvg('${esc(p.cat)}')))">` : iconSvg(p.cat);
  return `<article class="card" data-id="${esc(p.id)}" tabindex="0">
    <div class="thumb">${img}${p.badge?`<span class="badge">${esc(p.badge)}</span>`:""}${doorTag(p,"on-thumb")}</div>
    <div class="body">
      <div class="model">${esc(p.model)}</div>
      <div class="name">${esc(p.name)}</div>
      <ul class="specs">${(p.specs||[]).filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      ${priceBlock(p)}
      ${optRow(p)}
      <div class="more">상세정보 보기 ›</div>
    </div></article>`;
}
function render(){
  const s = DATA.site;
  $("#h-store").textContent = (s.store || "삼성스토어").toUpperCase() === "삼성스토어" ? "SAMSUNG STORE" : s.store;
  $("#h-apt").textContent = s.apartment;
  $("#h-title").textContent = s.title;
  $("#h-sub").textContent = s.subtitle;
  $("#h-period").textContent = "🗓 " + s.period;
  $("#h-benefits").innerHTML = (s.benefits||[]).filter(Boolean).map((b,i)=>`<div class="benefit"><span>${i+1}</span>${esc(b)}</div>`).join("");
  document.title = `${s.apartment} · 입주민 공동구매`;

  const visible = DATA.products.filter(p=>!p.hidden);
  const cats = DATA.categories.filter(c=>visible.some(p=>p.cat===c));
  visible.forEach(p=>{ if(!cats.includes(p.cat)) cats.push(p.cat) });

  $("#tabs").innerHTML = `<button class="tab on" data-c="">전체</button>` + cats.map(c=>`<button class="tab" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("#sections").innerHTML = cats.map((c,i)=>{
    const list = visible.filter(p=>p.cat===c);
    const acList = list.filter(p=>p.ac), rest = list.filter(p=>!p.ac);
    return `<section class="sec ${c==="시스템에어컨"?"feature":""}" id="sec-${i}" data-c="${esc(c)}">
      <div class="sec-h"><h2>${esc(c)}</h2><small>${acList.length?"평형별 추천 SET":list.length+"개 모델"}</small></div>
      ${acList.length?renderAC(acList):""}${rest.length?`<div class="grid">${rest.map(card).join("")}</div>`:""}</section>`;
  }).join("");

  $("#tabs").querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    $("#tabs").querySelectorAll(".tab").forEach(x=>x.classList.toggle("on", x===t));
    const c = t.dataset.c;
    document.querySelectorAll(".sec").forEach(sec=>sec.style.display = (!c || sec.dataset.c===c) ? "" : "none");
    window.scrollTo({top: $(".tabs").offsetTop, behavior:"smooth"});
    t.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"});
  });

  const tel = (s.phone||"").replace(/[^0-9+]/g,"");
  $("#c-desc").textContent = tel ? `${s.contactName||""} · ${s.phone}` : `${s.contactName||"담당자"} 연락처는 추후 안내됩니다.`;
  ["#c-btn","#fab"].forEach(id=>{ const a=$(id); a.href = tel ? "tel:"+tel : "#contact"; });
  $("#fab").classList.toggle("show", !!tel);
  $("#notice").innerHTML = (s.notice||[]).filter(Boolean).map(n=>`<li>${esc(n)}</li>`).join("");
  $("#ft-txt").textContent = `${s.store} · ${s.apartment} 입주민 공동구매`;
}

let DETAILS = null;
async function loadDetails(){
  if(DETAILS) return DETAILS;
  try{ const r = await fetch("details.json?v=" + (DATA.site.ver||"1")); DETAILS = r.ok ? await r.json() : {}; }catch(e){ DETAILS = {}; }
  return DETAILS;
}
const big = u => /images\.samsung\.com/.test(u) ? u.split("?")[0] + "?$Q90_776_776_F_JPG$" : u;
async function openDetail(id, push=true){
  const p = DATA.products.find(x=>x.id===id); if(!p) return;
  const D = (await loadDetails())[p.model] || {};
  const gal = (D.gallery && D.gallery.length) ? D.gallery.map(big) : [p.img].filter(Boolean);
  const specs = D.specs || [];
  $("#pd-title").textContent = p.name;
  $("#pd-body").innerHTML = `
    <div class="pd-split">
      <div>
        <div class="pd-gwrap">
          <div class="pd-gal" id="pd-gal">${gal.length ? gal.map(u=>`<div><img src="${esc(u)}" alt="" draggable="false"></div>`).join("") : `<div>${iconSvg(p.cat)}</div>`}</div>
          ${gal.length>1 ? `<button class="pd-nav l" id="pd-prev" aria-label="이전 사진">‹</button><button class="pd-nav r" id="pd-next" aria-label="다음 사진">›</button><span class="pd-cnt" id="pd-cnt">1 / ${gal.length}</span>` : ""}
        </div>
        ${gal.length>1 ? `<div class="pd-dots" id="pd-dots">${gal.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>` : ""}
      </div>
      <div>
        <div class="pd-info">
          <div class="model">${esc(p.model)}</div>
          <div class="name">${esc(p.name)}</div>
          ${doorTag(p,"in-pd")}
          <ul class="specs">${(p.specs||[]).filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
          ${priceBlock(p)}${optRow(p)}
        </div>
        <div class="pd-act"><a class="p1" href="#contact" data-close>공동구매 상담 문의</a></div>
      </div>
    </div>
    ${specs.length ? `<div class="pd-spec"><h4>상세 스펙</h4>${specs.map((g,i)=>`<details class="sg" ${i<2?"open":""}><summary>${esc(g.g)}</summary><table>${g.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table></details>`).join("")}</div>` : ""}
    <div class="pd-src">스펙·이미지 출처: 삼성전자 공식 홈페이지. 세부 사양은 제조사 사정에 따라 변경될 수 있습니다.</div>`;
  const pd = $("#pd"); pd.classList.add("open"); pd.setAttribute("aria-hidden","false");
  $("#pd-body").scrollTop = 0; document.body.style.overflow = "hidden";
  const g = $("#pd-gal"), dots = $("#pd-dots");
  if(g && dots) setupGallery(g, dots, gal.length);
  if(push) history.pushState({pd:id}, "", "#p=" + encodeURIComponent(id));
}
function setupGallery(g, dots, n){
  const prev = $("#pd-prev"), next = $("#pd-next"), cnt = $("#pd-cnt");
  const idx = ()=> Math.round(g.scrollLeft / g.clientWidth);
  const go = i => { i = Math.max(0, Math.min(n-1, i)); g.scrollTo({left: i * g.clientWidth, behavior:"smooth"}); };
  const sync = ()=>{ const i = idx(); dots.querySelectorAll("i").forEach((d,k)=>d.classList.toggle("on",k===i)); if(cnt) cnt.textContent = `${i+1} / ${n}`; if(prev) prev.disabled = i<=0; if(next) next.disabled = i>=n-1; };
  g.addEventListener("scroll", sync, {passive:true}); sync();
  prev && (prev.onclick = e=>{ e.stopPropagation(); go(idx()-1); });
  next && (next.onclick = e=>{ e.stopPropagation(); go(idx()+1); });
  dots.querySelectorAll("i").forEach((d,k)=> d.onclick = ()=> go(k));
  // 마우스 드래그 (PC)
  let sx=0, sl=0, down=false, moved=false;
  g.addEventListener("pointerdown", e=>{ if(e.pointerType!=="mouse") return; down=true; moved=false; sx=e.clientX; sl=g.scrollLeft; g.classList.add("drag"); g.setPointerCapture(e.pointerId); });
  g.addEventListener("pointermove", e=>{ if(!down) return; const dx=e.clientX-sx; if(Math.abs(dx)>3) moved=true; g.scrollLeft = sl - dx; });
  const end = e=>{ if(!down) return; down=false; g.classList.remove("drag"); const dx = (e.clientX||sx) - sx; const base = Math.round(sl / g.clientWidth); go(Math.abs(dx) > g.clientWidth*0.15 ? base + (dx<0?1:-1) : base); };
  g.addEventListener("pointerup", end); g.addEventListener("pointercancel", end);
  GAL_KEYS = e=>{ if(e.key==="ArrowRight") go(idx()+1); if(e.key==="ArrowLeft") go(idx()-1); };
}
let GAL_KEYS = null;
document.addEventListener("keydown", e=>{ if($("#pd").classList.contains("open") && GAL_KEYS) GAL_KEYS(e); });
function closeDetail(fromPop=false){
  const pd = $("#pd"); if(!pd.classList.contains("open")) return;
  pd.classList.remove("open"); pd.setAttribute("aria-hidden","true");
  if(!$("#admin").classList.contains("open")) document.body.style.overflow = "";
  if(!fromPop && history.state && history.state.pd) history.back();
}
$("#pd").addEventListener("click", e=>{ const c = e.target.closest("[data-close]"); if(!c) return; const toContact = c.getAttribute("href")==="#contact"; if(toContact) e.preventDefault(); closeDetail(); if(toContact) setTimeout(()=>$("#contact").scrollIntoView({behavior:"smooth"}), 250); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeDetail(); });
window.addEventListener("popstate", e=>{ if(e.state && e.state.pd) openDetail(e.state.pd,false); else closeDetail(true); });
$("#sections").addEventListener("click", e=>{ const c = e.target.closest(".card"); if(c) openDetail(c.dataset.id); });
$("#sections").addEventListener("keydown", e=>{ if(e.key==="Enter"){ const c = e.target.closest(".card"); if(c) openDetail(c.dataset.id); } });

/* ===== 한장에 보기 (A4 1장) ===== */
function renderOnePage(){
  const s=DATA.site, sd=!!s.showDiscount, vis=DATA.products.filter(p=>!p.hidden);
  const cats=DATA.categories.filter(c=>vis.some(p=>p.cat===c)); vis.forEach(p=>{ if(!cats.includes(p.cat)) cats.push(p.cat); });
  const t=new Date(), date=`${t.getFullYear()}. ${t.getMonth()+1}. ${t.getDate()}.`;
  const money = v => isNum(v) ? Number(v).toLocaleString() : `<span class="tbd">추후 안내</span>`;
  let no=0;
  const rows = cats.map(c=>{ const list=vis.filter(p=>p.cat===c);
    const head=`<tr class="ocat"><td colspan="${sd?6:5}"><span>■</span>${esc(c)} <span style="color:#8b909b;font-weight:600;margin-left:4px">${list.length}</span></td></tr>`;
    const acs=list.filter(p=>p.ac), rest=list.filter(p=>!p.ac);
    let acRows="";
    if(acs.length){ const g=[]; acs.forEach(p=>{ const k=p.ac.size+"|"+p.ac.rooms; let o=g.find(x=>x.k===k); if(!o){ o={k,p,"일반":null,"인피니트":null}; g.push(o);} o[p.ac.line]=p; });
      acRows=`<tr class="osub"><td></td><td>평형 · 구성</td><td>실외기 · 실내기</td><td class="on">무풍 일반</td><td class="on">무풍 인피니트</td>${sd?"<td></td>":""}</tr>`+g.map(o=>{ const a=o.p.ac;
        return `<tr><td class="oc">${++no}</td><td class="onm">${esc(a.size)} ${a.rooms}실 SET${a.full||a.rooms>=5?' <span class="tbd">전실</span>':""}</td><td class="omd">${esc(a.out||"")} · ${esc((a.ins||[]).map(x=>String(x).replace(/평형?$/,"")).join("+"))}평</td>${["일반","인피니트"].map(l=>{ const q=o[l]; return `<td class="on ogb">${q?money(q.price):"-"}${q&&finalOf(q)!=null?`<small class="ofin">최종 ${finalOf(q).toLocaleString()}</small>`:""}</td>`; }).join("")}${sd?'<td class="opct">-</td>':""}</tr>`; }).join(""); }
    return head + acRows + rest.map(p=>{
      const hasL=isNum(p.list), hasP=isNum(p.price), pct=(hasL&&hasP&&s.showDiscount&&Number(p.price)<Number(p.list))?Math.round((1-p.price/p.list)*100):0;
      const opt = p.optLabel ? `<small>${esc(p.optLabel)} ${isNum(p.optPrice)?"+"+Number(p.optPrice).toLocaleString()+"원":"+ 00만원"}</small>` : "";

function loadH2C(){ if(H2C) return H2C; H2C=new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"; sc.onload=()=>res(window.html2canvas); sc.onerror=rej; document.head.appendChild(sc); }); return H2C; }
async function saveOneImage(){
  toast("이미지를 만드는 중…");
  try{ const H=await loadH2C(), sh=$("#osheet"), prev=sh.style.transform; sh.style.transform="none";
    const cv=await H(sh,{scale:2,backgroundColor:"#ffffff",width:794,height:1123,windowWidth:1200}); sh.style.transform=prev;

async function sha256(t){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}

function copyText(t){ return (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).catch(()=>{ const a=document.createElement("textarea"); a.value=t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }); }
const BCOLS = ["모델명","제품명","품목","희망 권장소비자가","공동구매가","옵션금액","노출"];
function listTSV(){ return [BCOLS.join("\t"), ...DATA.products.map(p=>[p.model,p.name,p.cat,isNum(p.list)?p.list:"",isNum(p.price)?p.price:"",isNum(p.optPrice)?p.optPrice:"",p.hidden?"N":"Y"].join("\t"))].join("\n"); }
const normM = s => String(s||"").toUpperCase().replace(/[\s\-_·.]/g,"");
function parseBulk(text){
  const lines = text.replace(/\r/g,"").split("\n").map(l=>l.replace(/\s+$/,"")).filter(l=>l.trim());
  if(!lines.length) return [];
  const split = l => l.includes("\t") ? l.split("\t") : l.split(/\s*,\s*(?![0-9]{3}(?:[^0-9]|$))|\s{2,}/);
  const HD = [["model",/모델|model/i],["name",/제품명|상품명|품명|이름|name/i],["cat",/품목|카테고리|분류|category/i],["list",/출고|권장|소비자가/],["price",/공동|공구|판매가|특가|할인가|price/i],["opt",/옵션|벽걸이|추가/],["vis",/노출|표시|숨김|공개/]];
  let cols = ["model","list","price","opt"], start = 0;
  const first = split(lines[0]);
  if(first.some(c=>/모델|model/i.test(c))){ cols = first.map(c=>{ const h=HD.find(([,r])=>r.test(c.trim())); return h?h[0]:null; }); start = 1; }
  const num = c => { const t=String(c??"").trim(); if(!t || t==="-") return null; const d=t.replace(/[^0-9]/g,""); return d ? Number(d) : null; };
  const vis = c => { const t=String(c??"").trim().toUpperCase(); if(!t) return undefined; if(/^(Y|O|1|TRUE|노출|보임|공개|SHOW)$/.test(t)) return true; if(/^(N|X|0|FALSE|숨김|비공개|HIDE)$/.test(t)) return false; return undefined; };
  return lines.slice(start).map(l=>{ const c=split(l), r={};
    cols.forEach((k,j)=>{ if(!k) return; const v=c[j];
      if(k==="model"||k==="name"||k==="cat") r[k]=String(v??"").trim();
      else if(k==="vis") r.vis=vis(v);
      else r[k] = (v===undefined) ? undefined : num(v); });
    return r; }).filter(r=>r.model);
}
function matchProduct(m){
  const n=normM(m); if(!n) return -1;
  let i = DATA.products.findIndex(p=>normM(p.model)===n || normM(p.name)===n); if(i>=0) return i;
  if(n.length>=4){ const c=DATA.products.map((p,k)=>[p,k]).filter(([p])=>normM(p.model).includes(n)||n.includes(normM(p.model))&&normM(p.model).length>=6); if(c.length===1) return c[0][1]; }
  return -1;
}
function bulkPlan(){
  return (BULK.rows||[]).map(r=>{
    const i=matchProduct(r.model), p=i>=0?DATA.products[i]:null;
    const pick=(k,old)=> r[k]===undefined ? old : (r[k]===null ? (BULK.clearEmpty?null:old) : r[k]);
    if(!p) return { r, i, list:r.list??null, price:r.price??null, opt:r.opt??null, hidden:r.vis===false, status: BULK.addNew?"add":"none" };
    const nx={ list:pick("list",p.list??null), price:pick("price",p.price??null), opt:pick("opt",p.optPrice??null), hidden: r.vis===undefined ? !!p.hidden : !r.vis,
      name: r.name || p.name, cat: r.cat || p.cat };
    const chg = (nx.list??null)!==(p.list??null) || (nx.price??null)!==(p.price??null) || (nx.opt??null)!==(p.optPrice??null) || nx.hidden!==!!p.hidden || nx.name!==p.name || nx.cat!==p.cat;
    return { r, i, p, ...nx, status: chg?"chg":"same" };
  });
}
function adBulk(){
  return `<div class="box"><h3>엑셀 붙여넣기로 한번에 입력</h3>
    <ol class="howto"><li><b>현재 목록 복사</b>를 눌러 엑셀에 붙여넣기</li><li>엑셀에서 희망 권장소비자가·공동구매가·옵션금액·노출(Y/N)을 입력</li><li>제목 줄까지 표 전체를 복사해 아래 칸에 붙여넣기 → <b>미리보기</b> → <b>적용하기</b></li></ol>
    <div class="row-btn"><button class="btn" id="b-copy">현재 목록 복사 (엑셀용)</button><button class="btn" id="b-form">빈 양식 복사</button></div>
    <label class="fld" style="margin-top:14px"><span>여기에 붙여넣기</span><textarea id="b-text" class="bulk-ta" spellcheck="false" placeholder="모델명&#9;희망 권장소비자가&#9;공동구매가&#10;KQ75QNH70AFXKR&#9;3,490,000&#9;2,890,000">${esc(BULK.text)}</textarea>
      <em>제목 줄이 있으면 열 이름(${BCOLS.join("·")})으로 자동 인식해요. 필요한 열만 있어도 됩니다. 제목이 없으면 ‘모델명 / 희망 권장소비자가 / 공동구매가 / 옵션금액’ 순서로 읽어요.</em></label>
    <div class="chk"><input type="checkbox" id="b-new" ${BULK.addNew?"checked":""}><label for="b-new">목록에 없는 모델은 새 제품으로 추가</label></div>
    <div class="chk"><input type="checkbox" id="b-clear" ${BULK.clearEmpty?"checked":""}><label for="b-clear">빈 가격 칸은 가격 지우기 <span style="color:var(--mute)">(해제하면 기존 값 유지)</span></label></div>
    <div class="row-btn"><button class="btn blue" id="b-prev">미리보기</button>${BULK.rows&&BULK.rows.length?`<button class="btn gold" id="b-apply">적용하기</button><button class="btn" id="b-reset">지우기</button>`:""}</div></div>
    ${BULK.rows ? bulkPreview() : ""}`;
}
function bulkPreview(){
  const plan=bulkPlan(); if(!plan.length) return `<div class="box">읽을 수 있는 줄이 없어요. 모델명 열이 있는지 확인해 주세요.</div>`;
  const c = k => plan.filter(x=>x.status===k).length;
  const cell = (o,n) => (o??null)===(n??null) ? (isNum(n)?Number(n).toLocaleString():"-") : `<s>${isNum(o)?Number(o).toLocaleString():"없음"}</s><span class="chg">${isNum(n)?Number(n).toLocaleString():"지움"}</span>`;
  const tag = {chg:'<span class="tag c">변경</span>',same:'<span class="tag s">동일</span>',none:'<span class="tag n">목록에 없음</span>',add:'<span class="tag a">새로 추가</span>'};
  return `<div class="box"><h3>미리보기</h3>
    <div class="bsum"><span class="c">변경 ${c("chg")}</span><span>동일 ${c("same")}</span>${c("add")?`<span class="a">새로 추가 ${c("add")}</span>`:""}${c("none")?`<span class="n">목록에 없음 ${c("none")}</span>`:""}</div>
    <div class="btw"><table class="bt"><thead><tr><th>상태</th><th>모델 / 제품명</th><th>희망 권장소비자가</th><th>공동구매가</th><th>옵션</th><th>노출</th></tr></thead><tbody>
    ${plan.map(x=>{ const p=x.p||{}; const warn = isNum(x.list)&&isNum(x.price)&&Number(x.price)>Number(x.list);
      return `<tr><td>${tag[x.status]}</td><td><b>${esc(x.r.model)}</b><s style="text-decoration:none">${esc(x.p?x.name:(x.r.name||""))}</s></td>
        <td class="r">${x.p?cell(p.list,x.list):(isNum(x.list)?Number(x.list).toLocaleString():"-")}</td>
        <td class="r">${x.p?cell(p.price,x.price):(isNum(x.price)?Number(x.price).toLocaleString():"-")}${warn?'<span class="w">희망 권장소비자가보다 높음</span>':""}</td>
        <td class="r">${x.p?cell(p.optPrice,x.opt):(isNum(x.opt)?Number(x.opt).toLocaleString():"-")}</td>
        <td>${x.p && x.hidden!==!!p.hidden ? `<span class="chg">${x.hidden?"숨김":"노출"}</span>` : (x.hidden?"숨김":"노출")}</td></tr>`; }).join("")}
    </tbody></table></div></div>`;
}
function applyBulk(){
  const plan=bulkPlan(); let n=0, a=0;
  plan.forEach((x,k)=>{
    if(x.p && x.status==="chg"){ Object.assign(x.p,{ list:x.list, price:x.price, optPrice:x.opt, hidden:x.hidden, name:x.name, cat:x.cat }); n++; }
    if(!x.p && x.status==="add"){
      const cat = x.r.cat || DATA.categories[0] || "";
      if(cat && !DATA.categories.includes(cat)) DATA.categories.push(cat);
      DATA.products.push({ id:"p"+Date.now()+"_"+k, cat, name:x.r.name||x.r.model, model:x.r.model, specs:[], img:"", list:x.list, price:x.price, optPrice:x.opt, optLabel:"", badge:"", hidden:x.hidden });
      a++;
    }
  });
  BULK = { text:"", rows:null, addNew:BULK.addNew, clearEmpty:BULK.clearEmpty };
  keepDraft(); render(); drawAdmin();
  toast(`${n}개 수정${a?`, ${a}개 추가`:""} — ‘저장·배포’를 눌러야 모든 사람에게 반영돼요.`, 4000);
}

function bindAdmin(){
  const v = $("#ad-view");
  v.oninput = e=>{
    const el = e.target, it = el.closest(".pitem");
    if(it && el.dataset.k){
      const p = DATA.products[+it.dataset.i], k = el.dataset.k;
      if(k==="specs") p.specs = unlines(el.value);
      else if(k==="list"||k==="price"||k==="optPrice"||k==="point"){ p[k] = numOrNull(el.value); const fo=it.querySelector(".fin-o"); if(fo) fo.value=finalOf(p)!=null?finalOf(p).toLocaleString():"-"; }
      else if(k==="hidden") p.hidden = el.checked;
      else if(k==="hideList") p.hideList = el.checked;
      else p[k] = el.value.trim();
      if(k==="name") it.querySelector(".t b").textContent = p.name;
      if(k==="list"||k==="price"){ const pc=it.querySelector(".pc"); if(pc) pc.textContent=pctOf(p); }
    }
    if(el.dataset.s) DATA.site[el.dataset.s] = el.value.trim();
    if(el.dataset.sl) DATA.site[el.dataset.sl] = unlines(el.value);
    if(el.dataset.cats !== undefined) DATA.categories = unlines(el.value);
    if(el.classList && el.classList.contains("s-disc")){ DATA.site.showDiscount = el.checked; keepDraft(); render(); }
    if(el.id==="b-text") BULK.text = el.value;
    if(el.dataset.ac){ const p=DATA.products[+el.closest(".pitem").dataset.i]; const k=el.dataset.ac;
      if(k==="ins"){ p.ac.ins=el.value.split(/[,·+]/).map(x=>x.trim()).filter(Boolean); p.ac.rooms=p.ac.ins.length; } else p.ac[k]=el.value.trim(); }
  };
  v.onchange = async e=>{
    const el = e.target;
    if(el.dataset.k==="list"||el.dataset.k==="price"||el.dataset.k==="optPrice"||el.dataset.k==="point"){ const n=numOrNull(el.value); el.value = n? n.toLocaleString():""; drawStatus(el); }
    if(el.classList.contains("vis")){ const p=DATA.products[+el.closest(".pitem").dataset.i]; p.hidden=!el.checked; keepDraft(); render(); redrawKeep(); return; }
    if(el.id==="f-cat"){ AF.cat=el.value; redrawKeep(); return; }
    if(el.id==="b-new"||el.id==="b-clear"){ BULK[el.id==="b-new"?"addNew":"clearEmpty"]=el.checked; if(BULK.rows) redrawKeep(); return; }
    if(el.classList.contains("p-file") && el.files[0]) await uploadImage(DATA.products[+el.closest(".pitem").dataset.i], el.files[0]);
  };
  v.onclick = e=>{
    const fv = e.target.closest("[data-fv]"); if(fv){ AF.vis=fv.dataset.fv; redrawKeep(); return; }
    const bb = e.target.closest("#b-copy,#b-form,#b-prev,#b-apply,#b-reset,#p-showall,#p-hideall");
    if(bb){
      if(bb.id==="b-copy") return copyText(listTSV()).then(()=>toast("현재 목록을 복사했어요. 엑셀에 붙여넣으세요."));
      if(bb.id==="b-form") return copyText(BCOLS.join("\t")).then(()=>toast("양식 제목 줄을 복사했어요."));
      if(bb.id==="b-prev"){ BULK.text=$("#b-text").value; BULK.rows=parseBulk(BULK.text); return redrawKeep(); }
      if(bb.id==="b-apply"){ if(confirm("미리보기 내용대로 적용할까요?")) applyBulk(); return; }
      if(bb.id==="b-reset"){ BULK.text=""; BULK.rows=null; return drawAdmin(); }
      if(bb.id==="p-showall"||bb.id==="p-hideall"){ const hide=bb.id==="p-hideall";
        DATA.products.forEach(p=>{ const show=(AF.vis==="all"||(AF.vis==="on")===!p.hidden)&&(!AF.cat||p.cat===AF.cat); if(show) p.hidden=hide; });
        keepDraft(); render(); redrawKeep(); return toast(hide?"목록의 제품을 모두 숨겼어요.":"목록의 제품을 모두 노출했어요."); }
    }
    const b = e.target.closest("[data-act],.c-go,#p-add,#g-save,#g-test,#g-clear,#dl,#rv,#pw-set");
    if(!b) return;
    const it = b.closest(".pitem"), i = it ? +it.dataset.i : -1, P = DATA.products;
    const act = b.dataset.act;
    if(act==="toggle"){ if(e.target.closest(".sw")) return; const p=P[i]; openId = openId===p.id?null:p.id; it.classList.toggle("open"); const mb=it.querySelector(".more"); if(mb) mb.textContent = it.classList.contains("open")?"▴":"⋯"; return; }
    if(act==="up"&&i>0){ e.stopPropagation(); [P[i-1],P[i]]=[P[i],P[i-1]]; drawAdmin(); return; }
    if(act==="down"&&i<P.length-1){ e.stopPropagation(); [P[i+1],P[i]]=[P[i],P[i+1]]; drawAdmin(); return; }
    if(act==="dup"){ const c=JSON.parse(JSON.stringify(P[i])); c.id="p"+Date.now(); P.splice(i+1,0,c); openId=c.id; drawAdmin(); return; }
    if(act==="del"){ if(confirm(`'${P[i].name}' 을(를) 삭제할까요?`)){ P.splice(i,1); drawAdmin(); } return; }
    if(b.classList.contains("c-go")){
      const p=P[i], pct=parseFloat(it.querySelector(".c-pct").value);
      if(!isNum(p.list)||isNaN(pct)) return toast("희망 권장소비자가와 할인율을 먼저 입력하세요.");
      p.price = Math.round(p.list*(1-pct/100)/100)*100;
      it.querySelector('[data-k="price"]').value = p.price.toLocaleString(); it.querySelector(".c-pct").value=""; drawStatus(it.querySelector('[data-k="price"]'));
      return;
    }
    if(b.id==="p-add"){ AF.vis="all"; const c={id:"p"+Date.now(),cat:AF.cat||DATA.categories[0]||"",name:"새 제품",model:"",specs:[],img:"",list:null,price:null,badge:"",hidden:false}; P.push(c); openId=c.id; drawAdmin(); setTimeout(()=>document.querySelector(".pitem.open")?.scrollIntoView({block:"center"}),50); return; }
    if(b.id==="g-save"||b.id==="g-test"){
      const g={owner:$("#g-owner").value.trim(),repo:$("#g-repo").value.trim(),branch:$("#g-branch").value.trim()||"main",token:$("#g-token").value.trim()};
      LS.set("gb_gh", JSON.stringify(g));
      if(b.id==="g-save") return toast("이 기기에 저장했습니다.");
      return ghGet("data.json").then(r=>toast(r?"연결 성공 — data.json 확인됨":"연결은 되었지만 data.json 이 없습니다.")).catch(err=>toast("연결 실패: "+err.message,4000));
    }
    if(b.id==="g-clear"){ LS.del("gb_gh"); drawAdmin(); return toast("토큰을 삭제했습니다."); }
    if(b.id==="dl") return download();
    if(b.id==="rv"){ if(confirm("저장하지 않은 수정 내용을 모두 되돌릴까요?")){ DATA=JSON.parse(JSON.stringify(ORIGINAL)); LS.del("gb_draft"); $("#draftbar").classList.remove("show"); render(); drawAdmin(); } return; }
    if(b.id==="pw-set"){ const n=$("#newpw").value; if(n.length<4) return toast("4자 이상 입력하세요."); sha256(n).then(h=>{ DATA.site.pwHash=h; $("#newpw").value=""; toast("저장·배포하면 새 비밀번호가 적용됩니다."); }); }
  };
}
function drawStatus(el){
  const it = el.closest(".pitem"); if(!it) return;
  const p = DATA.products[+it.dataset.i], ok = isNum(p.list)&&isNum(p.price);
  it.classList.toggle("need", !ok); const pc=it.querySelector(".pc"); if(pc) pc.textContent=pctOf(p);
  const h=document.querySelector(".h3s"); if(h) h.textContent=`가격 입력 ${DATA.products.filter(x=>isNum(x.list)&&isNum(x.price)).length} / ${DATA.products.length}`;
}

/* ===== 저장: 깃허브 API 또는 파일 다운로드 ===== */
function gh(){ const g = JSON.parse(LS.get("gb_gh")||"{}"); return (g.owner&&g.repo&&g.token) ? g : null; }
function b64(str){ const bytes = new TextEncoder().encode(str); let s=""; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s); }
async function ghReq(path, opt={}){
  const g = gh(); if(!g) throw new Error("저장 설정이 없습니다");
  const url = `https://api.github.com/repos/${g.owner}/${g.repo}/contents/${path}` + (opt.method ? "" : `?ref=${encodeURIComponent(g.branch)}`);
  const r = await fetch(url, {...opt, headers:{Authorization:`Bearer ${g.token}`,Accept:"application/vnd.github+json"}});
  if(r.status===404 && !opt.method) return null;
  if(!r.ok){ const t = await r.json().catch(()=>({})); throw new Error(t.message || r.status); }
  return r.json();
}
const ghGet = p => ghReq(p);
async function ghPut(path, base64, msg){
  const g = gh(), cur = await ghGet(path).catch(()=>null);
  return ghReq(path, {method:"PUT", body:JSON.stringify({message:msg, content:base64, branch:g.branch, ...(cur&&cur.sha?{sha:cur.sha}:{})})});
}
function download(){
  const blob = new Blob([JSON.stringify(DATA,null,2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "data.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  toast("data.json 을 저장소의 같은 파일과 교체하세요.", 3500);
}
$("#ad-save").onclick = async ()=>{
  if(!gh()){ download(); return; }
  const btn = $("#ad-save"); btn.disabled = true; btn.textContent = "저장 중…";
  try{
    await ghPut("data.json", b64(JSON.stringify(DATA,null,2)), "공동구매 데이터 업데이트");
    ORIGINAL = JSON.parse(JSON.stringify(DATA)); LS.del("gb_draft"); $("#draftbar").classList.remove("show"); render();
    toast("저장 완료 — 1~2분 뒤 모든 사람에게 반영됩니다.", 4000);
  }catch(err){ toast("저장 실패: "+err.message+" (다운로드로 대체하세요)", 4500); }
  btn.disabled = false; btn.textContent = "저장·배포";
};

/* 이미지: 최대 900px JPEG 로 줄여서 images/ 에 업로드 */
async function uploadImage(p, file){
  const dataUrl = await new Promise(res=>{
    const img = new Image(); img.onload = ()=>{
      const sc = Math.min(1, 900/Math.max(img.width,img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      const x = c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",.86)); URL.revokeObjectURL(img.src);
    }; img.src = URL.createObjectURL(file);
  });
  if(!gh()){ p.img = dataUrl; drawAdmin(); return toast("토큰이 없어 이 기기 미리보기용으로만 넣었습니다. 실제 배포는 images/ 폴더에 파일을 올리고 주소를 적어주세요.", 5000); }
  const name = `images/${(p.model||p.id).replace(/[^A-Za-z0-9_-]/g,"")||p.id}.jpg`;
  toast("이미지 업로드 중…");
  try{ await ghPut(name, dataUrl.split(",")[1], `이미지 ${name}`); p.img = name + "?v=" + Date.now(); drawAdmin(); toast("업로드 완료 — 저장·배포를 눌러 반영하세요.", 3500); }
  catch(err){ toast("업로드 실패: "+err.message, 4000); }
}

load();
